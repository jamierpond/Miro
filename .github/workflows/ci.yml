name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Only develop may be merged into main. This job is a required status
  # check on main, and main accepts a commit only if that commit already
  # carries passing checks. A commit earns this check by being pushed to
  # develop (or by a develop -> main pull request), so fast-forwarding
  # main to develop passes, while pushing any other branch does not.
  merge-gate:
    name: Verified on develop
    runs-on: ubuntu-latest
    steps:
      - name: Check the source of this commit
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" = "main" ] \
             && [ "$HEAD" != "develop" ]; then
            echo "::error::Only 'develop' may be merged into 'main' (got '$HEAD')."
            exit 1
          fi
          echo "OK: event=$EVENT ref=$REF head=$HEAD base=$BASE"

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
            cmake_configure_args: -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

          - name: Windows Clang
            os: windows-latest
            cmake_configure_args: -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl

          - name: macOS Universal
            os: macos-26
            cmake_configure_args: >
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
              -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

          - name: Linux Clang
            os: ubuntu-latest
            cmake_configure_args: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

          - name: Linux GCC
            os: ubuntu-latest
            cmake_configure_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

          - name: iOS
            os: macos-26
            generator: Xcode
            cmake_configure_args: >
              -DCMAKE_SYSTEM_NAME=iOS
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
            cmake_build_args: --config Release -- -sdk iphonesimulator
            build_only: true

          # Cross build through the NDK's own toolchain file, using the
          # newest NDK preinstalled on the runner.
          - name: Android
            os: ubuntu-latest
            cmake_configure_args: >
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
              -DANDROID_ABI=arm64-v8a
              -DANDROID_PLATFORM=android-24
            build_only: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The JSON number tests select a decimal-comma locale to prove the
      # parser and printer ignore LC_NUMERIC. Ubuntu runners ship only
      # C and en_US, so one has to be generated.
      - name: Install a decimal-comma locale
        if: runner.os == 'Linux'
        run: sudo locale-gen de_DE.UTF-8

      - name: Configure
        run: >
          cmake -B build
          -G ${{ matrix.generator || 'Ninja' }}
          ${{ matrix.generator == 'Xcode' && ' ' || '-DCMAKE_BUILD_TYPE=Release' }}
          ${{ matrix.cmake_configure_args }}

      - name: Build
        run: cmake --build build ${{ matrix.cmake_build_args }}

      # iOS and Android are build-only lanes — we verify the library
      # compiles for the iphonesimulator SDK and the NDK but skip running
      # the test binary. The test logic is platform-independent and is
      # already exercised on macOS and Linux, so booting a simulator or an
      # emulator just to re-run it is pure CI cost.
      - name: Test
        if: ${{ !matrix.build_only }}
        run: ctest --test-dir build --output-on-failure
